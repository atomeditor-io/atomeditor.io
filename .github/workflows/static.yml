# Regenerate the package registry, then deploy the site to GitHub Pages.
# Runs on every push to main (keeps api/ fresh after manual regeneration),
# weekly (picks up new tags pushed to package forks), and manually.
name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  schedule:
    - cron: "0 3 * * 0"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Regenerate package registry
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node generator/generate-registry.js
      - name: Commit regenerated api/
        run: |
          git config user.name "atomeditor-io[bot]"
          git config user.email "329224475+atomeditor-io[bot]@users.noreply.github.com"
          git add api
          git diff --cached --quiet || git commit -m "chore(api): regenerate package registry [skip ci]"
          git push
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload entire repository (including freshly regenerated api/)
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
